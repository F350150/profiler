version: "v1"
rules:
  - id: cpu_vectorize_loop
    domain: cpu
    semantic: CPU_COMPUTE_BOUND
    preconditions:
      severity: high
    code_patterns:
      - vectorizable_loop
    transforms:
      - emit_patch_comment
    scoring:
      benefit: 0.85
      risk: 0.30
      confidence: 0.90
    conflict:
      exclusive_group: cpu_loop
      priority: 100
  - id: memory_locality
    domain: memory
    semantic: MEMORY_LOCALITY_POOR
    preconditions:
      severity: medium
    code_patterns:
      - alloc_or_copy_hotpath
    transforms:
      - emit_patch_comment
    scoring:
      benefit: 0.75
      risk: 0.35
      confidence: 0.80
    conflict:
      exclusive_group: mem_layout
      priority: 90
